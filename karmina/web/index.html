<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Karmina Studio</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body>
<header><a href="/" class="brand">karmina<span> / STUDIO</span></a><label class="language"><span data-t="language">Язык</span><select id="language"><option value="ru">Русский</option><option value="en">English</option><option value="lv">Latviešu</option></select></label></header>
<div class="shell"><aside><p class="eyebrow" data-t="workspace"></p><h2 data-t="projects"></h2><nav id="projects"></nav><button id="new" class="secondary" data-t="new"></button><div class="runtime"><span class="dot"></span><strong data-t="local"></strong><p data-t="notice"></p></div></aside>
<main><div id="error" role="alert" hidden></div><section id="create"><p class="eyebrow" data-t="eyebrow"></p><h1 data-t="headline"></h1><p class="intro" data-t="intro"></p><div class="filmstrip" aria-hidden="true"><span>01 / IDEA</span><span>02 / WORLD</span><span>03 / FRAME</span></div><form id="project-form"><label><span data-t="title"></span><input name="title" required maxlength="120" autocomplete="off"></label><label><span data-t="mode"></span><select name="mode"><option value="animation" data-t="animation"></option><option value="photorealistic" data-t="photorealistic"></option></select></label><label class="wide"><span data-t="brief"></span><textarea name="brief" required maxlength="12000" rows="4"></textarea></label><button type="submit" data-t="create"></button></form></section>
<section id="studio" hidden><p class="eyebrow" id="project-mode"></p><h1 id="project-title"></h1><p id="project-brief" class="intro"></p><div class="toolbar"><span id="progress"></span><button id="export" class="secondary" data-t="export" disabled></button></div><div id="pipeline" class="pipeline"></div><article class="artifact"><div class="artifact-heading"><div><p class="eyebrow" data-t="artifact"></p><h2 id="role-title"></h2></div><span id="revision"></span></div><p id="stage-hint"></p><label for="content" data-t="content"></label><textarea id="content" rows="15" maxlength="24000"></textarea><div class="actions"><button id="draft" class="secondary" data-t="draft"></button><button id="save" class="secondary" data-t="save"></button><button id="approve" data-t="approve"></button></div><details><summary data-t="history"></summary><div id="history"></div></details></article></section>
<footer data-t="footer"></footer></main></div></body></html>
